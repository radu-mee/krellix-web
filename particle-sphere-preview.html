<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Particle sphere study</title>
    <style>
      :root {
        font-family: Arial, Helvetica, sans-serif;
        color-scheme: dark;
        --surround: #0c0c0c;
        --slide: #141414;
        --text: #e7e7e7;
        --muted: #999;
        --control: #252525;
        --control-active: #494949;
        --edge: #363636;
      }

      :root[data-theme="light"] {
        color-scheme: light;
        --surround: #e9e5df;
        --slide: #faf8f4;
        --text: #39342e;
        --muted: #70695e;
        --control: #f7f2e9;
        --control-active: #e7d9c5;
        --edge: #d8cfc2;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: var(--surround);
        color: var(--text);
        transition: background-color 220ms ease, color 220ms ease;
      }

      main {
        width: min(1280px, calc(100vw - 48px));
        padding: 28px 0;
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 16px;
        margin-bottom: 14px;
      }

      .title {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: .08em;
        text-transform: uppercase;
      }

      .controls { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }

      .segmented {
        display: inline-flex;
        gap: 3px;
        padding: 3px;
        border: 1px solid var(--edge);
        border-radius: 9px;
        background: var(--control);
      }

      button {
        min-height: 34px;
        padding: 6px 12px;
        border: 1px solid transparent;
        border-radius: 6px;
        background: transparent;
        color: var(--text);
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }

      button[aria-pressed="true"] { background: var(--control-active); }
      button:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }

      .motion {
        border-color: var(--edge);
        background: var(--control);
      }

      .artboard {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        overflow: hidden;
        background: var(--slide);
        border: 1px solid var(--edge);
        box-shadow: 0 20px 70px rgb(0 0 0 / .16);
        transition: background-color 220ms ease;
      }

      canvas { display: block; width: 100%; height: 100%; }

      .caption {
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
      }

      @media (max-width: 600px) {
        main { width: calc(100vw - 24px); }
        .toolbar { align-items: flex-start; }
        .artboard { aspect-ratio: 4 / 3; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="toolbar">
        <h1 class="title">Particle sphere study</h1>
        <div class="controls" aria-label="Preview controls">
          <div class="segmented" role="group" aria-label="Color mode">
            <button type="button" id="dark" aria-pressed="true">Dark gray</button>
            <button type="button" id="light" aria-pressed="false">Light beige</button>
          </div>
          <button type="button" class="motion" id="motion" aria-pressed="false">Pause motion</button>
        </div>
      </div>
      <div class="artboard">
        <canvas id="sphere" role="img" aria-label="Animated glass-like particle sphere, cropped to a quarter in the upper right corner"></canvas>
      </div>
      <p class="caption">Standalone visual study · sphere cropped at the top and right edges</p>
    </main>

    <script>
      (() => {
        const canvas = document.getElementById('sphere');
        const ctx = canvas.getContext('2d', { alpha: false });
        const root = document.documentElement;
        const darkButton = document.getElementById('dark');
        const lightButton = document.getElementById('light');
        const motionButton = document.getElementById('motion');
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
        const count = 15000;
        const goldenAngle = Math.PI * (3 - Math.sqrt(5));
        const points = Array.from({ length: count }, (_, i) => {
          const y = 1 - (i + .5) * 2 / count;
          const ring = Math.sqrt(1 - y * y);
          const angle = i * goldenAngle;
          return {
            x: Math.cos(angle) * ring,
            y,
            z: Math.sin(angle) * ring,
            angle,
            seed: (Math.sin(i * 127.1) * 43758.5453) % 1,
          };
        });

        let width = 0;
        let height = 0;
        let frame = 0;
        let paused = reducedMotion.matches;
        let frozenTime = 0;
        let lastPaint = 0;
        const start = performance.now();

        function setTheme(theme) {
          root.dataset.theme = theme;
          darkButton.setAttribute('aria-pressed', String(theme === 'dark'));
          lightButton.setAttribute('aria-pressed', String(theme === 'light'));
          paint(paused ? frozenTime : (performance.now() - start) / 1000);
        }

        function setPaused(value) {
          if (value) frozenTime = (performance.now() - start) / 1000;
          paused = value;
          motionButton.textContent = paused ? 'Play motion' : 'Pause motion';
          motionButton.setAttribute('aria-pressed', String(paused));
          if (!paused) schedule();
        }

        function resize() {
          const rect = canvas.getBoundingClientRect();
          width = rect.width;
          height = rect.height;
          const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
          canvas.width = Math.round(width * pixelRatio);
          canvas.height = Math.round(height * pixelRatio);
          ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
          paint(paused ? frozenTime : (performance.now() - start) / 1000);
        }

        function paint(time) {
          if (!width || !height) return;
          const dark = root.dataset.theme === 'dark';
          ctx.fillStyle = dark ? '#141414' : '#faf8f4';
          ctx.fillRect(0, 0, width, height);

          // The sphere's center sits exactly on the artboard's upper-right corner.
          const radius = Math.min(width * .72, height * .98);
          const centerX = width;
          const centerY = 0;
          const glow = ctx.createRadialGradient(centerX, centerY, radius * .1, centerX, centerY, radius);
          glow.addColorStop(0, dark ? 'rgba(100,100,100,.14)' : 'rgba(224,204,173,.23)');
          glow.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = glow;
          ctx.fillRect(centerX - radius, 0, radius, radius);

          const turn = time * .15;
          const tilt = -.24 + Math.sin(time * .13) * .07;
          const cosTurn = Math.cos(turn);
          const sinTurn = Math.sin(turn);
          const cosTilt = Math.cos(tilt);
          const sinTilt = Math.sin(tilt);
          const base = dark ? [69, 70, 71] : [151, 127, 96];
          const shine = dark ? [173, 176, 176] : [214, 191, 159];

          for (let pass = 0; pass < 2; pass++) {
            for (const point of points) {
              const wave = 1
                + .068 * Math.sin(point.y * 13 + Math.atan2(point.z, point.x) * 4 - time * .72)
                + .023 * Math.sin(point.y * 31 + point.angle * .18 + time * .4);
              const x = point.x * cosTurn - point.z * sinTurn;
              const z0 = point.x * sinTurn + point.z * cosTurn;
              const y = point.y * cosTilt - z0 * sinTilt;
              const z = point.y * sinTilt + z0 * cosTilt;
              if ((z >= 0 ? 1 : 0) !== pass) continue;

              const perspective = 1 + z * .1;
              const px = centerX + x * radius * wave * perspective;
              const py = centerY + y * radius * wave * perspective;
              if (px < -3 || px > width + 3 || py < -3 || py > height + 3) continue;

              const band = Math.pow(
                Math.max(0, Math.sin(point.y * 17 + Math.atan2(point.z, point.x) * 6 - time * .85)),
                3
              );
              const rim = Math.pow(Math.min(1, Math.hypot(x, y)), 5);
              const highlight = Math.min(1, band * .72 + rim * .33 + Math.max(0, z) * .15);
              const channel = base.map((value, index) =>
                Math.round(value + (shine[index] - value) * highlight)
              );
              const alpha = (z >= 0 ? .56 : .15) + highlight * (z >= 0 ? .34 : .1);
              const size = (z >= 0 ? .8 : .55) + highlight * 1.3 + Math.abs(point.seed) * .25;
              ctx.fillStyle = `rgba(${channel[0]},${channel[1]},${channel[2]},${alpha})`;
              ctx.beginPath();
              ctx.arc(px, py, size, 0, Math.PI * 2);
              ctx.fill();

              if (z > .25 && band > .87 && Math.abs(point.seed) > .87) {
                ctx.fillStyle = dark ? 'rgba(228,229,227,.55)' : 'rgba(255,251,242,.8)';
                ctx.fillRect(px - .35, py - 2.2, .7, 4.4);
              }
            }
          }
        }

        function schedule() {
          if (frame || paused) return;
          frame = requestAnimationFrame(function tick(now) {
            frame = 0;
            if (paused) return;
            if (!document.hidden && now - lastPaint >= 32) {
              lastPaint = now;
              paint((now - start) / 1000);
            }
            schedule();
          });
        }

        darkButton.addEventListener('click', () => setTheme('dark'));
        lightButton.addEventListener('click', () => setTheme('light'));
        motionButton.addEventListener('click', () => setPaused(!paused));
        reducedMotion.addEventListener('change', event => setPaused(event.matches));
        new ResizeObserver(resize).observe(canvas);
        const requestedTheme = new URLSearchParams(window.location.search).get('theme');
        setTheme(requestedTheme === 'light' ? 'light' : 'dark');
        setPaused(paused);
        resize();
        schedule();
      })();
    </script>
  </body>
</html>
