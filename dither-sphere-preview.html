<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <title>Sphere motion study</title>
    <style>
      :root {
        font-family: Arial, Helvetica, sans-serif;
        color-scheme: dark;
        --surround: #0c0c0c;
        --slide: #141414;
        --text: #e7e7e7;
        --control: #252525;
        --control-active: #494949;
        --edge: #363636;
      }

      :root[data-theme="light"] {
        color-scheme: light;
        --surround: #e9e5df;
        --slide: #faf8f4;
        --text: #39342e;
        --control: #f7f2e9;
        --control-active: #e7d9c5;
        --edge: #d8cfc2;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: var(--surround);
        color: var(--text);
      }

      main {
        width: min(1280px, calc(100% - 48px));
        padding: 28px 0;
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px 16px;
        margin-bottom: 14px;
      }

      h1 {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: .08em;
        text-transform: uppercase;
      }

      .controls { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }

      .segmented {
        display: inline-flex;
        gap: 3px;
        padding: 3px;
        border: 1px solid var(--edge);
        border-radius: 9px;
        background: var(--control);
      }

      button {
        min-height: 34px;
        padding: 6px 12px;
        border: 1px solid transparent;
        border-radius: 6px;
        background: transparent;
        color: var(--text);
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }

      button[aria-pressed="true"] { background: var(--control-active); }
      button:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
      #motion { border-color: var(--edge); background: var(--control); }

      .artboard {
        aspect-ratio: 16 / 9;
        border: 1px solid var(--edge);
        background: var(--slide);
        box-shadow: 0 20px 70px rgb(0 0 0 / .16);
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
      }

      @media (max-width: 600px) {
        main { width: calc(100% - 24px); }
        .artboard { aspect-ratio: 4 / 3; }
        .segmented { flex-wrap: wrap; max-width: 100%; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="toolbar">
        <h1>Sphere motion study</h1>
        <div class="controls">
          <div class="segmented" role="group" aria-label="Motion style">
            <button type="button" data-movement="fabric" aria-pressed="true">Fabric</button>
            <button type="button" data-movement="orbit" aria-pressed="false">Orbit</button>
            <button type="button" data-movement="pulse" aria-pressed="false">Pulse</button>
            <button type="button" data-movement="sweep" aria-pressed="false">Light sweep</button>
            <button type="button" data-movement="glyph" aria-pressed="false">Glyph Pulse</button>
          </div>
          <div class="segmented" role="group" aria-label="Color mode">
            <button type="button" id="dark" aria-pressed="true">Dark gray</button>
            <button type="button" id="light" aria-pressed="false">Light beige</button>
          </div>
          <button type="button" id="motion">Pause motion</button>
        </div>
      </div>
      <div class="artboard">
        <canvas id="sphere" role="img" aria-label="An animated dithered sphere cropped to its lower-left quarter"></canvas>
      </div>
    </main>

    <script>
      (() => {
        const canvas = document.getElementById('sphere');
        const ctx = canvas.getContext('2d', { alpha: false });
        if (!ctx) return;

        const root = document.documentElement;
        const darkButton = document.getElementById('dark');
        const lightButton = document.getElementById('light');
        const motionButton = document.getElementById('motion');
        const movementButtons = Array.from(document.querySelectorAll('[data-movement]'));
        const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
        const motionSpeed = .6;
        const signs = '.:·-+=*/<>[]#%';
        const letters = 'ACEHKMNRSTVWXYZ';

        const palettes = {
          dark: [[20, 20, 20], [33, 33, 33], [50, 50, 50], [72, 72, 72], [105, 105, 105]],
          light: [[250, 248, 244], [244, 236, 223], [231, 217, 195], [212, 191, 161], [185, 157, 119]],
        };
        const bayer = [
           0, 48, 12, 60,  3, 51, 15, 63,
          32, 16, 44, 28, 35, 19, 47, 31,
           8, 56,  4, 52, 11, 59,  7, 55,
          40, 24, 36, 20, 43, 27, 39, 23,
           2, 50, 14, 62,  1, 49, 13, 61,
          34, 18, 46, 30, 33, 17, 45, 29,
          10, 58,  6, 54,  9, 57,  5, 53,
          42, 26, 38, 22, 41, 25, 37, 21,
        ];

        function packPalette(colors) {
          const rgba = new Uint8ClampedArray(colors.flatMap(([r, g, b]) => [r, g, b, 255]));
          return new Uint32Array(rgba.buffer);
        }

        let pixels;
        let colors;
        let artboardWidth = 0;
        let artboardHeight = 0;
        let palette = packPalette(palettes.dark);
        let movement = 'fabric';
        let running = !reducedMotion.matches;
        let elapsed = 0;
        let previousPaint = performance.now();
        let frame = 0;

        function setTheme(theme) {
          root.dataset.theme = theme;
          palette = packPalette(palettes[theme]);
          darkButton.setAttribute('aria-pressed', String(theme === 'dark'));
          lightButton.setAttribute('aria-pressed', String(theme === 'light'));
          paint();
        }

        function setMovement(value) {
          movement = value;
          elapsed = 0;
          for (const button of movementButtons) {
            button.setAttribute('aria-pressed', String(button.dataset.movement === value));
          }
          const description = value === 'glyph'
            ? 'A breathing sphere made of slowly drifting letters and symbols, clipped at the top and right'
            : 'An animated dithered sphere cropped to its lower-left quarter';
          canvas.setAttribute('aria-label', description);
          resize();
        }

        function setRunning(value) {
          running = value;
          motionButton.textContent = running ? 'Pause motion' : 'Play motion';
          cancelAnimationFrame(frame);
          frame = 0;
          if (running && !document.hidden) {
            previousPaint = performance.now();
            frame = requestAnimationFrame(tick);
          }
        }

        function resize() {
          const { width, height } = canvas.getBoundingClientRect();
          if (!width || !height) return;
          artboardWidth = width;
          artboardHeight = height;
          const glyph = movement === 'glyph';
          const scale = glyph ? Math.min(window.devicePixelRatio || 1, 2) : .5;
          canvas.width = Math.max(1, Math.round(width * scale));
          canvas.height = Math.max(1, Math.round(height * scale));
          if (glyph) {
            ctx.setTransform(canvas.width / width, 0, 0, canvas.height / height, 0, 0);
            pixels = null;
            colors = null;
          } else {
            pixels = ctx.createImageData(canvas.width, canvas.height);
            colors = new Uint32Array(pixels.data.buffer);
          }
          paint();
        }

        function smoothFade(value) {
          const t = Math.max(0, Math.min(1, value));
          return t * t * (3 - 2 * t);
        }

        function glyphSeed(row, column) {
          const mixed = Math.imul(row + 1, 374761393) ^ Math.imul(column, 668265263);
          const hash = Math.imul(mixed ^ (mixed >>> 13), 1274126177);
          return (hash ^ (hash >>> 16)) >>> 0;
        }

        function paintGlyphPulse(width, height) {
          const light = root.dataset.theme === 'light';
          const breath = Math.sin(elapsed * 1.3);
          const radius = Math.min(width * .72, height * .98) * (1 + .035 * breath);
          const fontSize = Math.max(7.5, Math.min(10.5, width / 112));
          const columnStep = fontSize * .97;
          const rowStep = fontSize * 1.24;
          const feather = radius * .43;
          const bottomFeather = Math.min(52, Math.max(12, radius * .08));
          const lastRow = Math.ceil(Math.min(height, radius) / rowStep);
          const bandCenter = .55 + .08 * breath;

          ctx.fillStyle = light ? '#faf8f4' : '#141414';
          ctx.fillRect(0, 0, width, height);
          ctx.fillStyle = light ? '#8d765d' : '#c9c9c9';
          ctx.font = `${fontSize}px "Cascadia Mono", Consolas, monospace`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          for (let row = 0; row <= lastRow; row++) {
            // Offset the first row so the top edge cuts through the type.
            const rowY = row * rowStep + rowStep * .12;
            const y = rowY / radius;
            const drift = elapsed * (4 + 11 * Math.sin(row * .31 + .4)) + row * 3.7;
            const passedColumns = Math.floor(drift / columnStep);
            const shift = drift - passedColumns * columnStep;
            const rowRadius = radius * Math.sqrt(Math.max(0, 1 - y * y));
            const firstColumn = Math.floor((-rowRadius - shift) / columnStep);

            for (let column = firstColumn; column <= 0; column++) {
              const columnX = width + column * columnStep + shift;
              const x = (columnX - width) / radius;
              const distanceSquared = x * x + y * y;
              if (distanceSquared >= 1) continue;

              const edgeDistance = radius * (1 - Math.sqrt(distanceSquared));
              const coverage = smoothFade(Math.min(edgeDistance / feather, (height - rowY) / bottomFeather));
              if (coverage < .02) continue;

              const seed = glyphSeed(row, column - passedColumns);
              const depth = Math.sqrt(1 - distanceSquared);
              const band = smoothFade(1 - Math.abs(-.8 * x + .68 * y - bandCenter) / .23);
              const variation = .48 + (seed & 255) / 490;
              const shimmer = .84 + .16 * Math.sin(elapsed * 1.7 + (seed >>> 16) * .11);
              const brightness = (.23 + .31 * depth + .20 * band) * (1 + .13 * breath);
              ctx.globalAlpha = coverage * brightness * variation * shimmer;
              const alphabet = (seed & 3) === 0 ? letters : signs;
              ctx.fillText(alphabet[(seed >>> 8) % alphabet.length], columnX, rowY);
            }
          }
          ctx.globalAlpha = 1;
        }

        function paint() {
          if (movement === 'glyph' && artboardWidth && artboardHeight) {
            paintGlyphPulse(artboardWidth, artboardHeight);
            return;
          }
          if (!pixels) return;
          const { width, height } = pixels;
          const fabric = movement === 'fabric';
          const orbit = movement === 'orbit';
          const pulse = movement === 'pulse';
          const sweep = movement === 'sweep';
          const breath = pulse ? Math.sin(elapsed * 1.3) : 0;
          const radius = Math.min(width * .72, height * .98) * (1 + .035 * breath);
          const bottomFeather = Math.min(26, Math.max(6, radius * .08));
          const rimFeather = pulse ? radius * .43 : bottomFeather;
          const broadRipple = { latitude: 9, around: 3, amplitude: .068 };
          const fineRipple = { latitude: 20, around: 2, amplitude: .017 };
          const rimVariation = fabric ? broadRipple.amplitude + fineRipple.amplitude : 0;
          const innerFeatherRadius = 1 - rimVariation - rimFeather / radius;
          const radiusSquared = radius * radius;
          const extent = radius * 1.13;
          const firstColumn = Math.max(0, Math.floor(width - extent));
          const lastRow = Math.min(height, Math.ceil(extent));
          const turn = orbit ? elapsed * .58 : elapsed * .15;
          const tilt = fabric ? -.24 + Math.sin(elapsed * .13) * .07 : -.24;
          const cosTurn = Math.cos(turn);
          const sinTurn = Math.sin(turn);
          const cosTilt = Math.cos(tilt);
          const sinTilt = Math.sin(tilt);
          const waveTime = elapsed * .72;
          const fineTime = elapsed * .4;
          const bandTime = elapsed * .85;
          // The light starts on the sphere, then loops with both ends of the path offscreen.
          const sweepPosition = ((elapsed + 2.3) % 6.4) / 6.4 * 1.76 - .3;
          const lastTone = palette.length - 1;
          colors.fill(palette[0]);
          for (let row = 0; row < lastRow; row++) {
            const y = (row + .5) / radius;
            const ySquared = y * y;
            const bottomClearance = height - row - .5;
            for (let column = firstColumn; column < width; column++) {
              const xPixels = column + .5 - width;
              const x = xPixels / radius;
              const distanceSquared = xPixels * xPixels / radiusSquared + ySquared;
              if (distanceSquared > 1.22) continue;

              // Sample the visible hemisphere, then rotate back into the sphere's coordinates.
              const distance = Math.sqrt(distanceSquared);
              const depth = Math.sqrt(Math.max(0, 1 - distanceSquared));
              const sphereY = y * cosTilt + depth * sinTilt;
              const untiltedZ = depth * cosTilt - y * sinTilt;
              const sphereX = x * cosTurn + untiltedZ * sinTurn;
              const sphereZ = untiltedZ * cosTurn - x * sinTurn;
              let coverage = 1;
              if (distance > innerFeatherRadius || bottomClearance < bottomFeather) {
                let edge = 1;
                if (fabric) {
                  // Use the same point along each ray to keep the fabric silhouette continuous.
                  const rimX = x / distance;
                  const rimY = y / distance;
                  const rimZ = -rimY * sinTilt;
                  const rimLatitude = rimY * cosTilt;
                  const rimAngle = Math.atan2(rimZ * cosTurn - rimX * sinTurn, rimX * cosTurn + rimZ * sinTurn);
                  const rimWave = rimLatitude * broadRipple.latitude + rimAngle * broadRipple.around - waveTime;
                  const rimFine = rimLatitude * fineRipple.latitude + rimAngle * fineRipple.around + fineTime;
                  edge += broadRipple.amplitude * Math.sin(rimWave) + fineRipple.amplitude * Math.sin(rimFine);
                }
                const edgeDistance = (edge - distance) * radius;
                if (edgeDistance <= 0) continue;
                coverage = smoothFade(Math.min(edgeDistance / rimFeather, bottomClearance / bottomFeather));
              }

              const lighting = .15 + .3 * depth - .16 * x - .19 * y;
              const rim = .22 * Math.pow(Math.min(1, distance), 7);
              let shade = lighting + rim;
              if (fabric) {
                const angle = Math.atan2(sphereZ, sphereX);
                const wave = sphereY * broadRipple.latitude + angle * broadRipple.around - waveTime;
                const fine = sphereY * fineRipple.latitude + angle * fineRipple.around + fineTime;
                const band = Math.max(0, Math.sin(sphereY * 11 + angle * 4 - bandTime));
                shade += .12 * Math.cos(wave) + .035 * Math.cos(fine) + .27 * band ** 3;
              } else if (orbit) {
                const firstPatch = Math.max(0, -.78 * sphereX + .25 * sphereY + .57 * sphereZ);
                const secondPatch = Math.max(0, .62 * sphereX + .7 * sphereY - .35 * sphereZ);
                shade = shade * .68 + .42 * firstPatch ** 4 + .38 * secondPatch ** 5;
              } else if (pulse) {
                shade = shade * (.86 + .23 * breath) + .14 * depth ** 3;
              } else if (sweep) {
                const alongSurface = .8 * (y - x) + .25 * depth;
                const beam = Math.max(0, 1 - Math.abs(alongSurface - sweepPosition) / .26);
                shade = shade * .67 + .45 * beam * beam;
              }
              const tone = shade * coverage * lastTone;

              // The fixed Bayer grid changes pixel coverage as the surface moves beneath it.
              const threshold = (bayer[((row & 7) << 3) | (column & 7)] + .5) / 64;
              const level = Math.max(0, Math.min(lastTone, Math.floor(tone + threshold)));
              colors[row * width + column] = palette[level];
            }
          }
          ctx.putImageData(pixels, 0, 0);
        }

        function tick(now) {
          const delta = now - previousPaint;
          if (delta >= 30) {
            previousPaint = now;
            elapsed += Math.min(delta, 80) * motionSpeed / 1000;
            paint();
          }
          frame = requestAnimationFrame(tick);
        }

        darkButton.addEventListener('click', () => setTheme('dark'));
        lightButton.addEventListener('click', () => setTheme('light'));
        motionButton.addEventListener('click', () => setRunning(!running));
        for (const button of movementButtons) {
          button.addEventListener('click', () => setMovement(button.dataset.movement));
        }
        reducedMotion.addEventListener('change', event => setRunning(!event.matches));
        document.addEventListener('visibilitychange', () => setRunning(running));
        new ResizeObserver(resize).observe(canvas);
        const query = new URLSearchParams(location.search);
        const requestedMovement = query.get('motion');
        if (movementButtons.some(button => button.dataset.movement === requestedMovement)) {
          setMovement(requestedMovement);
        }
        const theme = query.get('theme');
        setTheme(theme === 'light' ? 'light' : 'dark');
        setRunning(running);
      })();
    </script>
  </body>
</html>
